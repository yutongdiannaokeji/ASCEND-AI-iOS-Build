name: ASCEND AI unsigned iOS archive

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard GitHub-hosted macOS runner
        type: choice
        required: true
        options:
          - macos-26-intel
          - macos-26
        default: macos-26-intel

permissions:
  contents: read

concurrency:
  group: ascend-ios-arm-retry
  cancel-in-progress: false

jobs:
  archive:
    name: Compile for iPhone and iPad
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Open encrypted source
        env:
          ASCEND_BUILD_KEY: ${{ secrets.ASCEND_BUILD_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ascend-source" "$RUNNER_TEMP/ascend-private-logs"
          node capsule.mjs open source source.tar.gz.enc "$RUNNER_TEMP/ascend-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/ascend-source.tar.gz" -C "$RUNNER_TEMP/ascend-source"
      - name: Run TypeScript and business tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ascend-source"
          {
            xcodebuild -version
            xcodebuild -showsdks
            npm ci
            npm run check
            python3 -m unittest discover -s tests -p 'test_ios_*.py'
          } > "$RUNNER_TEMP/ascend-private-logs/checks.log" 2>&1
      - name: Generate the native workspace
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ascend-source"
          {
            npx expo prebuild --platform ios --no-install
            npx pod-install ios
          } > "$RUNNER_TEMP/ascend-private-logs/native-workspace.log" 2>&1
      - name: Archive with Xcode and verify IPA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ascend-source"
          bash scripts/build-ios-unsigned.sh > "$RUNNER_TEMP/ascend-private-logs/xcode-archive.log" 2>&1
      - name: Seal the IPA, checksum and diagnostics
        if: always()
        env:
          ASCEND_BUILD_KEY: ${{ secrets.ASCEND_BUILD_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out "$RUNNER_TEMP/ascend-result"
          cp -R "$RUNNER_TEMP/ascend-private-logs" "$RUNNER_TEMP/ascend-result/logs"
          app_out="$RUNNER_TEMP/ascend-source/artifacts/ios"
          if [ -f "$app_out/ASCEND-AI-ios-unsigned.ipa" ]; then
            cp "$app_out/ASCEND-AI-ios-unsigned.ipa" "$app_out/SHA256SUMS.txt" "$app_out/manifest.json" "$RUNNER_TEMP/ascend-result/"
          fi
          tar -czf "$RUNNER_TEMP/ascend-result.tar.gz" -C "$RUNNER_TEMP/ascend-result" .
          node capsule.mjs seal result "$RUNNER_TEMP/ascend-result.tar.gz" out/ascend-result.tar.gz.enc
      - name: Upload encrypted build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascend-ios-sealed-${{ github.run_number }}
          path: out/ascend-result.tar.gz.enc
          if-no-files-found: error
          retention-days: 7

